    function baseInfo(type){let name={repurchase:'处方粮周期复购',member:'新会员首购激励',conversion:'试用装转正装',recall:'处方粮流失召回'}[type];let notes={repurchase:'根据每个客户已购商品的历史购买周期，预估近期处于补货期的用户；到达触达日后，系统按规则自动生成人群并发送。',member:'适用于入会后尚未完成首次购买的会员；每个任务只创建一种入会人群，首次购买后自动停止后续触达。',conversion:'购买试用装的用户在达到等待天数、且尚未购买对应正装时进入人群；启用 AI 后仅在基础人群中优先筛选高、中意向用户。',recall:'前 X 天购买过商品、近 X 天未购的用户进入人群；会员与已购用户分开建任务，避免权益与频次互相影响。'}[type];return `<section class="panel"><h2 class="section-title">基础信息</h2><div class="basic-split"><div class="form-table">${field('活动名称',`<input id="task-name" type="text" value="${name}" maxlength="32"/><div class="field-help">0/32</div>`,true)}${field('活动描述',`<input type="text" value="${modelMeta[type].desc}" maxlength="32"/><div class="field-help">9/32</div>`)}${field('任务时间',`<div class="date-range"><input type="text" placeholder="请选择开始时间" value="2026-07-20"/><span style="text-align:center;color:#98a2b3">-</span><input type="text" placeholder="请选择结束时间" value="2026-12-31"/></div>`,true)}${field('投放策略',`在预计购买日前 ${num(1)} 天进行消息投放 <span class="hint">?</span>`,true)}${field('投放规则',`每天发送一次`)}${field('投放时间',`<label class="radio"><input type="radio" name="timing-base" checked/> 根据下单偏好时间段投放</label><label class="radio"><input type="radio" name="timing-base"/> 固定时间投放</label>`,true)}${field('投放类型',`<label class="radio"><input type="radio" name="send" checked/> 短信发送</label><label class="radio"><input type="radio" name="send"/> 咚咚推送</label>`,true)}</div><div class="info"><strong>模型说明：</strong>${notes}<br/><br/><strong>人群计算说明：</strong>每日按配置规则更新人群；每个用户同一时间只会命中一个营销节点，命中后按对应策略发送。</div></div></section>`}
    function selector(label,selected,kind){return `<div class="inline"><button class="chooser ${selected?'selected':''}" data-action="toggle-product" data-kind="${kind}">${selected?'更换商品组':'选择商品分组'}</button>${selected?`<span class="tag">${kind==='trial'?'肠胃舒适试用装组（3 SKU）':'肠胃舒适正装组（6 SKU）'}<button data-action="toggle-product" data-kind="${kind}">×</button></span>`:''}<span class="hint">${label}</span></div>`}
    function commonLimits(){return `<section class="panel"><h2 class="section-title">短信投放附加条件</h2><div class="info"><strong>投放限制</strong>每个用户每次任务只会命中一个策略节点；触达前系统会再次校验排除条件。</div><div class="limit-grid" style="margin-top:13px"><label class="check"><input type="checkbox" checked/> 屏蔽黑名单用户</label><label class="check"><input type="checkbox" checked/> 屏蔽活动白名单</label><label class="check"><input type="checkbox" checked/> 屏蔽近 7 天内已购买用户</label><label class="check"><input type="checkbox" checked/> 遵循店铺触达频控</label><label class="check"><input type="checkbox"/> 仅触达可接收营销信息的用户</label><label class="check"><input type="checkbox"/> 设置每日发送上限 ${num(3000)} 人</label></div><div class="test-line"><label class="check"><input type="checkbox"/> 先发送测试人群</label><input type="text" placeholder="输入测试手机号，多个以逗号分隔" style="max-width:360px"/></div></section>`}
    function aiBox(){return `<div class="ai-box ${state.ai?'enabled':''}" id="ai-box"><div class="ai-head"><span style="font-size:16px">✦</span><div><b>AI 智能筛选</b><span class="hint" style="margin-left:7px">在基础准入规则上，优先触达更可能购买正装的用户</span></div><button class="switch ${state.ai?'on':''}" data-action="ai"><i></i></button></div><div class="ai-body"><div class="ai-grid"><div class="ai-label">预测目标</div><div class="check-tags"><button class="choice-chip">未来 7 天购买</button><button class="choice-chip active">未来 14 天购买</button><button class="choice-chip">未来 30 天购买</button></div><div class="ai-label">触达人群</div><div class="check-tags"><button class="choice-chip active">高意向</button><button class="choice-chip active">中意向</button><button class="choice-chip">低意向</button><span class="hint">默认不触达低意向用户</span></div><div class="ai-label">触达时间</div><div class="radio-group"><label class="radio"><input type="radio" name="timing" checked/> AI 推荐最佳触达时间</label><label class="radio"><input type="radio" name="timing"/> 统一在购买后 ${num(10)} 天</label></div><div class="ai-label">正装推荐</div><div class="radio-group"><label class="radio"><input type="radio" name="recommend" checked/> AI 推荐正装商品组</label><label class="radio"><input type="radio" name="recommend"/> 使用人工指定的对应正装组</label></div><div class="ai-label">特征说明</div><div class="feature-note">试用装规格与次数、试用后间隔、正装浏览/加购、会员状态、历史消费与品类偏好。模型置信度或行为数据不足时，自动回退为人工指定正装商品组与统一触达日。</div></div></div></div>`}
    function conversionRules(){return `<section class="panel"><h2 class="section-title">人群规则</h2><div class="info"><strong>基础准入规则</strong>用户需同时满足下列条件。购买正装后会自动从后续策略中排除。</div><div class="rule-block"><div class="rule-label"><span class="step">1</span>购买过试用装商品组</div>${selector('请选择用于引导转正的试用装商品。',state.trial,'trial')}</div><div class="rule-block"><div class="rule-label"><span class="step">2</span>购买试用装后已满 ${num(7)} 天</div><div class="hint">以最近一次购买试用装的支付时间为准</div></div><div class="rule-block"><div class="rule-label"><span class="step">3</span>尚未购买对应正装商品组</div>${selector('选择与试用装相对应的正装商品。',state.formal,'formal')}</div>${aiBox()}<div class="summary"><b>当前规则摘要：</b>购买试用装商品组满 7 天，且未购买对应正装商品组的用户${state.ai?'；AI 将在其中筛选高/中意向用户并优先触达。':'。'}</div></section>`}
    function recallRules(){let typeText=state.userType==='member'?'会员':'已购用户（非会员）',absenceText=state.absence==='group'?'近 30 天未购买所选商品组':'近 30 天未购买店内任意商品';return `<section class="panel"><h2 class="section-title">人群规则</h2><div class="rule-block"><div class="rule-label"><span class="step">1</span>目标用户类型 <span class="hint">每次创建任务只能选择一种人群</span></div><div class="radio-group"><label class="radio"><input type="radio" name="type" data-action="type" value="member" ${state.userType==='member'?'checked':''}/> 会员</label><label class="radio"><input type="radio" name="type" data-action="type" value="buyer" ${state.userType==='buyer'?'checked':''}/> 已购用户</label></div><div class="field-help">已购用户指有历史购买记录、但当前非会员的用户。</div></div><div class="rule-block"><div class="rule-label"><span class="step">2</span>前 ${num(90)} 天内购买过所选商品组</div>${selector('可选择病症场景对应的处方粮商品组。',state.trial,'trial')}</div><div class="rule-block"><div class="rule-label"><span class="step">3</span>近 ${num(30)} 天未购</div><div class="radio-group"><label class="radio"><input type="radio" name="absence" data-action="absence" value="group" ${state.absence==='group'?'checked':''}/> 未购买所选商品组</label><label class="radio"><input type="radio" name="absence" data-action="absence" value="all" ${state.absence==='all'?'checked':''}/> 未购买店内任意商品</label></div></div><div class="rule-block"><div class="rule-label"><span class="step">4</span>自动排除</div><div class="inline"><span class="tag">黑名单用户</span><span class="tag">近期已重新购买用户</span><span class="tag">频控命中用户</span></div></div><div class="summary"><b>当前规则摘要：</b>圈选前 90 天内购买过所选商品组的${typeText}，且${absenceText}。</div></section>`}
    function simpleRules(type){let items=type==='repurchase'?['购买指定商品组','距最近一次购买满预估补货周期','近 7 天未购买同商品组']:['已入会会员','入会后未发生有效购买','注册后 30 天内'];return `<section class="panel"><h2 class="section-title">人群规则</h2><div class="info"><strong>${type==='repurchase'?'复购模型口径':'入会首购模型口径'}</strong>系统每日按规则更新人群，触达成功或转化后自动停止后续触达。</div>${items.map((x,i)=>`<div class="rule-block"><div class="rule-label"><span class="step">${i+1}</span>${x}</div>${i===0?selector('请选择商品分组。',state.trial,'trial'):i===1?`<div class="inline">${num(type==='repurchase'?28:7)} 天 <span class="hint">${type==='repurchase'?'按最近一次购买计算':'按入会时间计算'}</span></div>`:`<div class="hint">系统自动排除不符合条件的用户。</div>`}</div>`).join('')}${type==='member'?`<div class="summary"><b>预计人群：</b><button class="link" data-action="estimate">点击计算人数</button></div>`:''}</section>`}
    function strategy(type){let names=type==='recall'?['轻度流失（15-30 天）','中度流失（31-60 天）','重度流失（61 天以上）']:type==='conversion'?['高意向转正','中意向转正']:['策略人群 1','策略人群 2'];let count=state.steps;return `<section class="panel"><div class="strategy-toolbar"><h2 class="section-title" style="margin:0">人群筛选细分</h2><span class="info-inline">条件树每次仅命中一个策略节点，避免重复触达</span></div><div class="flow"><div class="flow-node rule"><div class="node-head">基础人群</div><div class="node-body"><b>${modelMeta[type].name}</b>基础准入规则</div></div><i class="arrow"></i><div class="flow-node condition"><div class="node-head">策略分层</div><div class="node-body"><b>${type==='recall'?'按流失程度':'按用户状态'}</b>进入对应触达策略</div></div>${state.ai&&type==='conversion'?`<i class="arrow"></i><div class="flow-node ai"><div class="node-head">AI 筛选</div><div class="node-body"><b>高 / 中意向</b>推荐时机与正装</div>`:''}<i class="arrow"></i><div class="flow-node action"><div class="node-head">营销触达</div><div class="node-body"><b>短信 / 咚咚 Push</b>触达内容与频次</div></div></div><div class="strategy-list" id="strategy-list">${Array.from({length:count},(_,i)=>`<div class="strategy-row"><div><h4>${names[i]||'新增策略 '+(i+1)}</h4><p>${type==='recall'?(i===0?'优先补货提醒':i===1?'定向权益召回':'低频强权益召回'):(i===0?'内容型提醒':'正装专属权益')}</p></div><div class="mini-field">满足条件后 <input class="num" type="number" value="${type==='recall'?(i+1)*15:(i+1)*7}"/> 天触达　每人最多 <input class="num" type="number" value="1"/> 次</div><button class="ghost small danger" data-action="remove-step" ${count===1?'disabled':''}>删除</button></div>`).join('')}</div><div style="margin-top:11px"><button class="primary small" data-action="add-step">新增策略</button></div></section><section class="panel"><h2 class="section-title">触达内容配置</h2><div class="channel-tabs"><button class="channel-tab ${state.channel==='sms'?'active':''}" data-action="channel" data-channel="sms">短信配置</button><button class="channel-tab ${state.channel==='push'?'active':''}" data-action="channel" data-channel="push">咚咚 Push 配置</button></div><div class="channel-content ${state.channel==='sms'?'active':''}"><div class="form-table">${field('短信签名',`<select><option>【皇家处方粮】</option></select>`)}${field('首次营销内容',`<textarea>尊敬的用户，您购买的处方粮试用装体验如何？为爱宠选择更适配的正装，点击查看专属推荐。</textarea>`,true)}${field('二次营销',`<label class="check"><input type="checkbox" checked/> 首次触达后 3 天未转化，发送一次提醒</label>`)}${field('发送时间',`<select><option>每日 10:00 - 20:00</option><option>每日 18:00 - 20:00</option></select>`)}</div></div><div class="channel-content ${state.channel==='push'?'active':''}"><div class="form-table">${field('Push 标题',`<input type="text" value="为爱宠选好下一袋处方粮"/>`,true)}${field('Push 内容',`<textarea>试用装体验结束后，正装将为爱宠提供更稳定的营养支持。</textarea>`,true)}${field('跳转页面',`<select><option>正装商品组落地页</option><option>店铺首页</option></select>`)}${field('发送时间',`<select><option>AI 推荐 / 每日 10:00 - 20:00</option></select>`)}</div></div></section>`}
    function modelPage(type){let rules=type==='conversion'?conversionRules():type==='recall'?recallRules():simpleRules(type);return `<div class="page-head"><div><h1>${modelMeta[type].name} <span style="font-size:12px;color:#8b96a6;font-weight:400">配置任务</span></h1></div><div class="button-row"><button class="ghost" data-action="go" data-go="overview">取消</button><button class="primary" data-action="save">确认创建</button></div></div><div class="grid-main"><div class="content-stack">${baseInfo(type)}${rules}${strategy(type)}${commonLimits()}<div class="footer-actions"><button class="ghost" data-action="go" data-go="overview">取消</button><button class="primary" data-action="save">确认创建</button></div></div></div>`}

    function solutionOverview(){let roadmap=[['M0｜MVP 原型与阶段资料讲解','2026.07.20','完成 MVP 流程原型、最小数据看板原型、Urinary 数据看板 V1 设想、实施范围及待确认事项讲解。','未开始','plan'],['M1｜阶段需求确认稿与 MVP 标准确认','2026.07.31','完成前两周需求调研，确认当前阶段实施内容、所需资料和完成标准，进入 MVP 开发。','未开始','plan'],['M2｜MVP 首购转复购流程上线','2026.08.12','目标用户识别、预计用完时间、教育 / 补购触达、购买结果回传和最小数据看板在生产环境小范围运行。','未开始','pending'],['M3｜Urinary 完整流程与看板 V1 上线','2026.08.31','泌尿道病程多阶段自动化流程和数据看板 V1 同步上线，并完成数据核对。','未开始','pending'],['M4｜Urinary 首轮优化与复用模板完成','2026.10.16','完成模型、规则、内容和数据看板 V1 的首轮优化，沉淀后续病症可复用模板。','未开始','pending'],['M5｜GI 流程与数据看板 V2 上线','2026.10.26','GI（肠胃道）自动化流程和数据看板 V2 上线，11 月 6 日完成首轮效果复盘与优化。','未开始','pending'],['M6｜Vital 流程与数据看板 V3 上线','2026.11.30','Vital（肾脏）长期管理流程和数据看板 V3 上线，12 月 11 日完成首轮效果复盘与优化。','未开始','pending'],['M7｜OW 流程与数据看板 V4 上线','2026.12.14','OW（体重管理）自动化流程和数据看板 V4 上线，12 月 25 日完成首轮效果复盘与优化。','未开始','pending'],['M8｜整体项目效果复盘','2026.12.25','汇总四个病症的自动化运营和数据看板结果，形成下一阶段优化事项与实施建议。','未开始','plan']];let flow=[['01','身份判断','统一 OneID 识别用户身份',['会员','已购非会员','未注册用户引导绑定','黑名单与频控排除']],['02','宠物判断','将用户购买、宠物档案与疾病标签映射到具体宠物',['OneCRM 宠物档案优先','SKU 品种标签补充','猫 / 狗与疾病场景','单宠 / 多宠独立轨迹']],['03','购买行为判断','按 SKU 商品组、购买容量和时间序列生成预测特征',['复购周期与预计耗尽日','入会未首购行为','试用至正装意向','流失程度与回流机会']],['04','BI 匹配权益与内容','根据人群、宠物和商品状态匹配权益、商品组和沟通内容',['精准商品与利益点','内容方向与短链素材','权益分层','A/B 实验方案']],['05','触达复盘','通过短信、咚咚 Push 等渠道执行，并回收经营结果',['触达与频控校验','转化与 GMV 回流','模型效果复盘','按季度更新训练数据']]];return `<div class="solution-page"><div class="page-head"><div><h1>方案总览 <span>生命周期营销模型</span></h1><p>项目周期：2026.07.20 - 2026.12.25。说明功能迭代计划、数据判定链路与各模型的算法和业务口径。</p></div><div class="button-row"><button class="ghost" data-action="go" data-go="overview">进入模型</button><button class="primary" data-action="go" data-go="dashboard">查看数据看板</button></div></div><section class="solution-band"><div class="solution-intro"><div class="solution-intro-main"><h2>从统一识别到可执行的人群营销</h2><p>以用户 OneID、宠物档案、疾病场景和商品组为共同输入，先完成身份与宠物归属判断，再按购买阶段预测复购、首购、试用转正、转段或召回机会，并匹配商品、权益、内容和触达策略。</p></div><div class="solution-principles"><div><b>经营目标</b><span>提升复购 GMV、正装转化和会员首购贡献。</span></div><div><b>分层原则</b><span>同一用户按具体宠物和商品线独立计算，避免不同宠物或产品线混算。</span></div><div><b>数据更新</b><span>人群日更；转段周期、消耗参数和训练样本建议每 3 个月更新一次。</span></div></div></div><div class="solution-outcomes"><div class="solution-outcome"><span>项目范围</span><strong>1 个 MVP 试点 + 3 个后续病症</strong></div><div class="solution-outcome"><span>核心经营模型</span><strong>复购 · 首购 · 转正 · 召回</strong></div><div class="solution-outcome"><span>可执行策略</span><strong>权益 · 内容 · 商品 · 触达</strong></div><div class="solution-outcome"><span>闭环评估</span><strong>GMV · 转化 · A/B · 人群回流</strong></div></div></section><section class="solution-band"><h2 class="solution-band-title">功能迭代计划 <small>正式排期来源：皇家处方粮自动化营销整体项目排期（2026.07.15）</small></h2><div class="roadmap">${roadmap.map(([name,time,content,status,tone])=>`<article class="roadmap-item"><span class="roadmap-time">${time}</span><h3>${name}</h3><p>${content}</p><span class="roadmap-status ${tone}">${status}</span></article>`).join('')}</div></section><section class="solution-band"><h2 class="solution-band-title">统一人宠判定链路 <small>人群先识别，再按宠物和商品关系生成模型策略</small></h2><div class="decision-flow">${flow.map(([index,title,desc,items])=>`<article class="decision-step"><span class="decision-index">${index}</span><h3>${title}</h3><p>${desc}</p><ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul></article>`).join('')}</div><div class="decision-note">低段位产品线建模时，已主动购买目标高段位产品线的用户应从低段位人群中剔除；多宠家庭按宠物对应的 SKU、疾病场景和购买轨迹分别计算，不能合并为单一消费周期。</div></section><section class="solution-band"><h2 class="solution-band-title">算法逻辑说明 <small>复购与小转正使用可解释的消耗预测；入会首购和流失召回使用业务口径</small></h2><div class="algorithm-shared"><strong>共同输入与优先级</strong><div class="algorithm-tags"><span>OneID 身份统一</span><span>OneCRM 宠物档案优先</span><span>SKU 品种 / 疾病标签补充</span><span>低段位与目标高段位产品线映射</span><span>有效支付订单与商品总容量</span><span>近 90 天浏览 / 加购行为</span></div></div><div class="algorithm-grid"><article class="algorithm-module"><h3>复购模型：预测补货时间</h3><p>以任务选定的商品组为计算边界。仅统计该商品组的有效支付订单，避免跨产品线购买干扰消耗周期。</p><dl class="algorithm-definition"><dt>Qᵢ</dt><dd>第 i 笔订单的商品总容量，等于单件容量 Dᵢ × 购买罐数 Cᵢ。</dd><dt>T₁ / Tₙ</dt><dd>该商品组第一笔与最近一笔有效支付订单时间。</dd><dt>W</dt><dd>用户日均消耗量，至少需要 2 笔有效订单计算。</dd></dl><div class="algorithm-formula">W = Σ(Qᵢ) / (Tₙ − T₁)<br/>T补货 = Tₙ + Qₙ / W</div><div class="algorithm-rule"><b>准入</b><span>n ≥ 2，且订单间隔和容量数据可用；若模型置信度不足，回退为同 SKU / 同品类的标准消耗周期。</span></div><div class="algorithm-rule"><b>触发</b><span>到达预计补货日，近 7 天未购买同商品组，且未命中频控、黑名单或其他排除规则时进入触达。</span></div><div class="algorithm-rule"><b>人宠约束</b><span>按宠物对应商品组独立计算；多宠家庭不将猫粮、犬粮或不同疾病配方的容量混入同一 W。</span></div></article><article class="algorithm-module"><h3>小转正与转段：预测正装 / 高段位购买</h3><p>任务需选择试用或低段位产品线，以及对应正装或目标高段位产品线。用户主动购买目标商品后，自动从候选人群中剔除。</p><dl class="algorithm-definition"><dt>Tₘ</dt><dd>低段位至目标高段位的平均转段周期，可按 SKU、宠物类型和疾病场景配置。</dd><dt>Qₙ / W</dt><dd>最近一单的预计消耗天数；试用场景可使用试用装容量，转段场景使用低段位最近一单容量。</dd><dt>行为信号</dt><dd>近 90 天浏览正装、加购正装、会员权益领取和店铺互动，用于转正意向排序。</dd></dl><div class="algorithm-formula">T耗尽 = Tₙ + Qₙ / W<br/>当 T耗尽 − T₁ ≥ Tₘ，且未购买目标商品时，进入转段候选；T耗尽后 1 日开始触达。</div><div class="algorithm-rule"><b>示例</b><span>1 段 800g 罐装，首单 3 罐、次单 4 罐，相隔 30 天，则 W 约为 80g / 天，次单预计 40 天消耗完。未达到 180 天转段周期时不触达；随后订单更新后，达到配置周期才进入预测。</span></div><div class="algorithm-rule"><b>小转正</b><span>试用装预计耗尽且等待期满足后，未购买对应正装的用户进入基础池；浏览或加购正装者优先进入高意向层。</span></div><div class="algorithm-rule"><b>参数更新</b><span>低至高段位间隔、SKU 容量和宠物日均消耗分布建议每 3 个月基于新订单数据重新训练。</span></div></article><article class="algorithm-module"><h3>入会首购：业务口径</h3><p>不使用消耗公式，基于会员状态和入会后互动行为识别首购机会。</p><div class="no-formula"><div><b>基础人群：</b>已入会且未发生有效购买的会员；历史未购与开卡未购人群分别创建任务。</div><div><b>优先条件：</b>入会时长、商品浏览、加购、关注、权益领取和店铺互动频次。</div><div><b>停止规则：</b>完成首次有效支付后退出后续触达；同一用户同时仅命中一个营销节点。</div></div></article><article class="algorithm-module"><h3>流失召回：业务口径</h3><p>不使用消耗公式，按最近购买时间、用户身份与未购范围识别流失层级。</p><div class="no-formula"><div><b>基础人群：</b>前设定周期购买过所选商品组，近设定周期未购买的会员或已购非会员；一次任务仅选择一种身份。</div><div><b>分层方式：</b>按购买中断时长、历史购买频次、历史 GMV、过往触达响应与宠物 / 病症偏好进行轻中重度流失分层。</div><div><b>策略原则：</b>优先为高价值、高回流意向用户配置差异化权益和内容，并通过 A/B 实验评估回流 GMV。</div></div></article></div></section></div>`}

ton><button class="primary" data-action="go" data-go="dashboard">查看数据看板</button></div></div><section class="solution-band"><h2 class="solution-band-title">功能迭代计划</h2><div class="roadmap">${roadmap.map(([name,time,content,status,tone])=>`<article class="roadmap-item"><span class="roadmap-time">${time}</span><h3>${name}</h3><p>${content}</p><span class="roadmap-status ${tone}">${status}</span></article>`).join('')}</div></section><section class="solution-band"><h2 class="solution-band-title">算法训练迭代计划 <small>以皇家处方粮订单、SKU 属性和宠物健康数据逐步提升预测精度</small></h2><div class="training-roadmap">${training.map(([title,content,note])=>`<article class="training-stage"><b>${title}</b><p>${content}</p><small>${note}</small></article>`).join('')}</div></section><section class="solution-band"><h2 class="solution-band-title">触点建设计划</h2><div class="touchpoint-grid"><div class="touchpoint-stage"><b>前期支持</b><span>京东短信、京东富信、咚咚 Push 用于触达宠物主；结合人群策略、内容和频控规则开展首期运营验证。</span></div><div class="touchpoint-stage later"><b>后期扩展</b><span>完成企微 / 社群对接后，可基于同一人群和策略直接在企微 / 社群触达宠物主，并回流渠道效果用于后续优化。</span></div></div></section><section class="solution-band"><h2 class="solution-band-title">皇家处方粮人宠判定链路 <small>以宠物病症和对应处方粮 SKU 为核心建立可执行策略</small></h2><div class="decision-flow">${flow.map(([index,title,desc,items])=>`<article class="decision-step"><span class="decision-index">${index}</span><h3>${title}</h3><p>${desc}</p><ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul></article>`).join('')}</div><div class="decision-note">同一宠物只使用与其猫犬属性、病症和对应处方粮 SKU 一致的订单计算消耗与补货周期。多宠家庭需分别建立宠物购买轨迹，不能把不同宠物、不同病症处方粮的容量合并计算。</div></section><section class="solution-band"><h2 class="solution-band-title">算法逻辑说明 <small>复购与小转正以处方粮消耗和购买行为为基础；入会首购和流失召回使用业务口径</small></h2><div class="algorithm-shared"><strong>共同输入与优先级</strong><div class="algorithm-tags"><span>OneID 订单与会员统一</span><span>SKU 猫犬 / 病症 / 规格 / 净含量</span><span>OneCRM 宠物档案</span><span>京东健康档案</span><span>有效支付订单</span><span>近 90 天浏览 / 加购正装</span></div></div><div class="algorithm-grid"><article class="algorithm-module"><h3>复购模型：预测处方粮补货时间</h3><p>以任务选定的皇家处方粮 SKU 商品组为计算边界，仅统计该宠物、该病症和该商品组的有效支付订单。</p><dl class="algorithm-definition"><dt>Qᵢ</dt><dd>第 i 笔订单购买的处方粮总净含量，等于单袋 / 罐净含量 Dᵢ × 购买数量 Cᵢ。</dd><dt>T₁ / Tₙ</dt><dd>该宠物购买同一处方粮商品组的第一笔与最近一笔有效支付时间。</dd><dt>W</dt><dd>该宠物对该处方粮的日均消耗量；至少需要 2 笔有效订单计算。</dd></dl><div class="algorithm-formula">W = Σ(Qᵢ) / (Tₙ − T₁)<br/>T补货 = Tₙ + Qₙ / W</div><div class="algorithm-rule"><b>基础训练</b><span>订单和 SKU 属性可直接输出初版预测；当订单不足时，回退到该 SKU 对应猫犬与病症的基础饲喂标准。</span></div><div class="algorithm-rule"><b>触发条件</b><span>到达预计补货日，近 7 天未购买同商品组，且未命中黑名单、退订或频控规则时进入触达。</span></div><div class="algorithm-rule"><b>数据迭代</b><span>接入 OneCRM 和京东健康档案后，按宠物病症、体重和健康状态校准 W 与补货窗口。</span></div></article><article class="algorithm-module"><h3>小转正模型：预测试用装至正装购买</h3><p>任务需选择试用装商品组与对应正装商品组，并保持宠物类型和病症配方一致；已购买对应正装的用户自动退出候选人群。</p><dl class="algorithm-definition"><dt>T试用耗尽</dt><dd>试用装最近一单预计吃完时间，根据试用装净含量和该宠物的日均消耗量计算。</dd><dt>T等待</dt><dd>试用结束后的观察等待期，可按处方粮 SKU、病症和试用规格配置。</dd><dt>正装意向</dt><dd>近 90 天浏览正装、加购正装、权益领取和店铺互动，用于高、中、低意向排序。</dd></dl><div class="algorithm-formula">T试用耗尽 = Tₙ + Qₙ / W<br/>T触达 = T试用耗尽 + T等待</div><div class="algorithm-rule"><b>基础人群</b><span>购买试用装、到达预计耗尽日和等待期、且未购买对应正装商品组的宠物主。</span></div><div class="algorithm-rule"><b>优先排序</b><span>浏览或加购对应正装商品的宠物主优先进入高意向层；无行为信号者保留为低频触达或人工策略人群。</span></div><div class="algorithm-rule"><b>人宠约束</b><span>试用装和正装必须匹配相同的猫犬属性和病症处方配方，不跨宠物、不跨病症推荐。</span></div></article><article class="algorithm-module"><h3>入会首购：业务口径</h3><p>不使用消耗公式，围绕皇家处方粮会员在入会后的首单转化进行运营。</p><div class="no-formula"><div><b>基础人群：</b>已入会且未发生有效购买的会员；历史未购与开卡未购人群分别创建任务。</div><div><b>优先条件：</b>浏览处方粮商品、加购、关注、权益领取，以及店铺互动频次。</div><div><b>停止规则：</b>完成首次有效支付后退出后续触达；同一用户同时仅命中一个营销节点。</div></div></article><article class="algorithm-module"><h3>流失召回：业务口径</h3><p>不使用消耗公式，按同一处方粮商品组的购买中断情况识别召回机会。</p><div class="no-formula"><div><b>基础人群：</b>前设定周期购买过所选处方粮商品组，近设定周期未购买的会员或已购非会员；一次任务仅选择一种身份。</div><div><b>分层方式：</b>按购买中断时长、历史购买频次、历史 GMV、过往触达响应和宠物病症偏好进行轻中重度流失分层。</div><div><b>策略原则：</b>优先为高价值、高回流意向宠物主配置差异化权益和内容，并通过 A/B 实验评估回流 GMV。</div></div></article></div></section></div>`}

      const metricKey=state.associationMetric||'rate';

      const columnFilter=state.associationColumn||'all';
      const rowProducts=rowFilter==='all'?rowCatalog:[rowFilter];
      const columnProducts=columnFilter==='all'?columnCatalog:[columnFilter];
      const visibleRelations=relations.filter(item=>rowProducts.includes(item.from)&&columnProducts.includes(item.to));
      const values=visibleRelations.map(item=>item[metricKey]);
      const min=values.length?Math.min(...values):0;
      const max=values.length?Math.max(...values):1;
      const range=max-min||1;
      const relationMap=new Map(relations.map(item=>[`${item.from}__${item.to}`,item]));

    function solutionOverviewWithTabs(){
      const activeTab=state.planTab||'schedule';
      const tabs=`<div class="solution-tabs" role="tablist" aria-label="方案总览内容"><button class="solution-tab ${activeTab==='schedule'?'active':''}" type="button" role="tab" aria-selected="${activeTab==='schedule'}" data-action="plan-tab" data-plan-tab="schedule">项目排期</button><button class="solution-tab ${activeTab==='logic'?'active':''}" type="button" role="tab" aria-selected="${activeTab==='logic'}" data-action="plan-tab" data-plan-tab="logic">算法逻辑说明</button></div>`;
      if(activeTab==='logic')return `<div class="solution-page compact-solution-page"><div class="page-head"><div><h1>方案总览 <span>项目排期与上线准备</span></h1><p>皇家处方粮营销模型业务计算口径</p></div><div class="button-row"><button class="ghost" data-action="go" data-go="overview">进入模型</button><button class="primary" data-action="go" data-go="dashboard">查看数据看板</button></div></div>${tabs}<section class="solution-band"><h2 class="solution-band-title">共同判断口径</h2><div class="logic-context"><b>宠物档案优先</b><span>以 OneID 统一订单、会员和触达记录；以任务选定的处方粮 SKU 商品组为计算边界。当订单提炼出的宠物类型或病症信息与 OneCRM 宠物档案不一致时，以宠物档案为准进行人宠归属、商品匹配和后续模型计算。</span></div></section><section class="solution-band"><h2 class="solution-band-title">各模型业务计算逻辑</h2><div class="logic-grid"><article class="logic-card"><div class="logic-card-head"><h3>复购模型</h3><p>预测同一宠物、同一处方粮商品组的补货时间</p></div><div class="logic-card-body"><div class="logic-item"><b>计算对象</b><span>仅统计该宠物、该病症和所选商品组的有效支付订单；不同宠物、猫犬或处方病症不混算。</span></div><div class="logic-item"><b>订单不足</b><span>用户仅完成首单时，使用首单 SKU 经皇家确认的平均复购间隔 I_SKU 预测二购时间。</span></div><div class="logic-formula">Qᵢ = Dᵢ × Cᵢ<br/>T二购 = T₁ + I_SKU<br/>W = ΣQᵢ ÷ (Tₙ − T₁)<br/>T补货 = Tₙ + Qₙ ÷ W</div><div class="logic-symbols"><div class="logic-symbol"><b>T₁</b><span>该宠物购买所选商品组的首笔有效支付时间。</span></div><div class="logic-symbol"><b>Tₙ</b><span>该宠物最近一笔有效支付时间。</span></div><div class="logic-symbol"><b>Dᵢ / Cᵢ</b><span>第 i 笔订单的单件净含量 / 购买数量。</span></div><div class="logic-symbol"><b>Qᵢ / Qₙ</b><span>第 i 笔 / 最近一笔订单的处方粮总净含量。</span></div><div class="logic-symbol"><b>I_SKU</b><span>经皇家确认的首单 SKU 平均复购间隔。</span></div><div class="logic-symbol"><b>W</b><span>该宠物对所选处方粮的日均消耗量。</span></div><div class="logic-symbol"><b>T二购</b><span>用户仅有首单时预测的第二次购买时间。</span></div><div class="logic-symbol"><b>T补货</b><span>模型预测的下一次补货时间。</span></div></div><div class="logic-item"><b>触发条件</b><span>到达预计补货日，近 7 天未购买同商品组，且未命中退订、黑名单或频控规则时进入触达。</span></div></div></article><article class="logic-card"><div class="logic-card-head"><h3>小转正模型</h3><p>预测试用装耗尽后的对应正装购买机会</p></div><div class="logic-card-body"><div class="logic-item"><b>基础人群</b><span>购买试用装、已达到预计耗尽日和等待期，且尚未购买对应正装商品组的宠物主。</span></div><div class="logic-item"><b>计算规则</b><span>有多笔订单时按历史订单计算日均消耗量 W；仅有首单时，以首单 SKU 的确认平均复购间隔换算耗尽日。</span></div><div class="logic-formula">Qₙ = Dₙ × Cₙ<br/>T试用耗尽 = Tₙ + Qₙ ÷ W<br/>T触达 = T试用耗尽 + T等待</div><div class="logic-symbols"><div class="logic-symbol"><b>Tₙ</b><span>该宠物最近一笔试用装有效支付时间。</span></div><div class="logic-symbol"><b>Dₙ / Cₙ</b><span>最近一笔试用装的单件净含量 / 购买数量。</span></div><div class="logic-symbol"><b>Qₙ</b><span>最近一笔试用装订单的总净含量。</span></div><div class="logic-symbol"><b>W</b><span>该宠物对试用装商品组的日均消耗量。</span></div><div class="logic-symbol"><b>T等待</b><span>试用装耗尽后的观察等待期，可按 SKU、病症和试用规格配置。</span></div><div class="logic-symbol"><b>T试用耗尽</b><span>模型预测的试用装预计吃完时间。</span></div><div class="logic-symbol"><b>T触达</b><span>满足等待期后进入正装营销的时间。</span></div></div><div class="logic-item"><b>优先排序</b><span>近 90 天浏览或加购对应正装商品的宠物主优先进入高意向层；试用装与正装必须匹配同一猫犬属性和病症配方。</span></div></div></article><article class="logic-card"><div class="logic-card-head"><h3>入会首购模型</h3><p>识别已入会、尚未完成首次有效购买的会员</p></div><div class="logic-card-body"><div class="logic-item"><b>基础人群</b><span>已入会且未发生有效购买的会员；历史未购和开卡未购需分别创建任务。</span></div><div class="logic-item"><b>排序口径</b><span>结合入会时长、处方粮浏览、加购、关注和店铺互动等行为，识别更可能完成首购的人群。</span></div><div class="logic-item"><b>停止规则</b><span>完成首次有效支付后自动退出后续触达；同一用户在同一时间仅命中一个营销节点。</span></div><div class="logic-note"><b>说明：</b>该模型不使用消耗公式，以会员状态和首购行为口径进行运营判断。</div></div></article><article class="logic-card"><div class="logic-card-head"><h3>流失召回模型</h3><p>按同一处方粮商品组的购买中断情况识别召回机会</p></div><div class="logic-card-body"><div class="logic-item"><b>基础人群</b><span>前设定周期购买过所选商品组，近设定周期未购买的会员或已购非会员；一次任务只能选择一种身份。</span></div><div class="logic-item"><b>分层口径</b><span>按购买中断时长、历史购买频次、历史 GMV、过往触达响应和宠物病症偏好划分轻、中、重度流失。</span></div><div class="logic-item"><b>运营规则</b><span>优先对高价值、高回流意向宠物主配置差异化权益和内容，并通过 A/B 实验评估回流 GMV。</span></div><div class="logic-note"><b>说明：</b>该模型不使用消耗公式，以购买中断和运营价值口径进行人群筛选。</div></div></article></div></section></div>`;

      }

      }
      const cards=app.querySelectorAll('.logic-grid>.logic-card');
      const repurchase=cards[0];
      const conversion=cards[1];
      if(repurchase){
        repurchase.innerHTML=`<div class="logic-card-head"><h3>复购模型</h3><p>从订单补货预测按数据接入逐期升级为单宠补货预测</p></div><div class="logic-card-body"><div class="logic-item"><b>计算对象</b><span>以同一 PetID、同一病症和同一处方粮商品组为边界，仅统计有效支付订单；不同宠物、猫犬或病症配方不混算。</span></div><div class="logic-model-mode"><b>第 1 期｜V1 订单与 SKU 基线</b><span>仅根据该宠物的有效支付订单、SKU 净含量和数量计算实际日均消耗；仅有首单时，以对应 SKU 的平均复购间隔预测补货时间。</span></div><div class="logic-formula">Q_i = D_i x C_i<br>W订单 = sum(Q_i) / (T_n - T_1)<br>T补货 = T_n + Q_n / W订单；首单回退 T_1 + I_SKU</div><div class="logic-model-mode profile"><b>第 2 期｜V2 OneCRM 宠物档案校正</b><span>OneCRM 完成 OneID - PetID 关联且字段有效后，以单宠属性对 V1 的消耗和补货窗口校正，不改变已发生订单事实。</span></div><div class="logic-feature-grid"><div class="logic-feature"><b>宠物品种 / 品牌标签</b><span>识别体型与饲喂需求差异</span></div><div class="logic-feature"><b>宠物体重</b><span>估算每日食用量基线</span></div><div class="logic-feature"><b>病症场景 / 病症</b><span>约束处方粮与预测范围</span></div><div class="logic-feature"><b>宠物年纪</b><span>区分不同生命阶段</span></div><div class="logic-feature"><b>吃粮时长</b><span>识别开始、稳定与长期阶段</span></div><div class="logic-feature"><b>购买 SKU / 规格</b><span>匹配净含量、配方与商品组</span></div></div><div class="logic-formula profile-formula">W档案 = R_SKU x F品种/体重/年龄/病症/吃粮时长<br>W预测 = lambda x W订单 + (1 - lambda) x W档案<br>T补货 = T_n + Q_n / W预测</div><div class="logic-model-mode health-profile"><b>第 3 期｜V3 京东健康档案补强</b><span>在 V2 单宠轨迹基础上，接入已授权、可匹配同一 PetID 的京东健康档案，以健康和处方相关信息补强病症适配、病程阶段与补货窗口置信度。</span></div><div class="logic-formula health-profile-formula">W最终 = W预测 x F京东健康档案<br>T补货 = T_n + Q_n / W最终<br>F京东健康档案仅在健康信息与订单、OneCRM 档案一致时生效</div><div class="logic-symbols"><div class="logic-symbol"><b>Q_i</b><span>第 i 笔订单的商品总净含量。</span></div><div class="logic-symbol"><b>R_SKU</b><span>该 SKU 在对应宠物和病症下的基础日饲喂量。</span></div><div class="logic-symbol"><b>F特征</b><span>由历史订单与有效 OneCRM 档案得到的校正系数。</span></div><div class="logic-symbol"><b>lambda</b><span>同宠历史订单的置信权重；订单越完整，权重越高。</span></div><div class="logic-symbol"><b>F京东健康档案</b><span>仅使用有效匹配且一致的健康 / 处方相关档案作为增量校验。</span></div><div class="logic-symbol"><b>I_SKU</b><span>仅在首单且缺少更高阶段数据时使用的平均复购间隔。</span></div></div><div class="logic-iteration-note health-profile-note"><b>三期升级与回退：</b>V1 解决订单与 SKU 的基础补货预测；V2 形成 OneCRM 单宠校正；V3 再补强健康档案校验。V3 缺失、无效或冲突时回退 V2；V2 不足时回退 V1，冲突信息标记待复核，不自动覆盖订单消耗事实。</div><div class="logic-item"><b>模型输出</b><span>预计补货日、补货窗口、复购意向、推荐商品组、预测阶段和可追溯的特征解释标签；达到窗口且未复购时进入触达。</span></div></div>`;
